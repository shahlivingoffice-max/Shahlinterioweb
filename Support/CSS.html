<style>
  :root {
    --maroon: #621119;
    --maroon-dark: #4a0d14;
    --maroon-soft: #f8f2f2;
    --navy: #183d8b;
    --ink: #2b1a1c;
    --muted: #7a5f62;
    --line: #e4d6d7;
    --bg: #f4eeee;
    --ok: #1d7a43;
    --err: #b3261e;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  /* must beat the display rules below, or hidden panels still catch clicks */
  [hidden] {
    display: none !important;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 16px;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
  }

  /* ---------- brand ---------- */
  .brand {
    text-align: center;
    padding: 8px 0 18px;
  }

  .brand-logo {
    width: 100%;
    max-width: 300px;
    height: auto;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  /* ---------- card ---------- */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 6px 20px rgba(98, 17, 25, .06);
  }

  .step-title {
    margin: 0 0 4px;
    font-size: 20px;
    color: var(--maroon);
    font-weight: 800;
  }

  .step-note {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 14px;
  }

  .support-line {
    margin: 16px 0 0;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }

  .support-line a {
    color: var(--maroon);
    font-weight: 700;
    text-decoration: none;
  }

  /* ---------- query type cards ---------- */
  .type-grid {
    display: grid;
    gap: 12px;
  }

  .type-card {
    display: flex;
    gap: 14px;
    align-items: center;
    width: 100%;
    text-align: left;
    padding: 16px;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
    font: inherit;
    transition: border-color .15s, transform .1s, background .15s;
  }

  .type-card:active {
    transform: scale(.99);
  }

  .type-card:hover,
  .type-card:focus-visible {
    border-color: var(--maroon);
    background: var(--maroon-soft);
    outline: none;
  }

  .type-icon {
    flex: 0 0 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: grid;
    place-items: center;
    font-size: 22px;
  }

  .type-text strong {
    display: block;
    font-size: 16px;
    color: var(--ink);
  }

  .type-text span {
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- fields ---------- */
  .back-link {
    display: block;
    background: none;
    border: 0;
    padding: 0 0 10px;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .chip {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--maroon);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .field {
    display: block;
    margin-bottom: 16px;
  }

  .label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .label i {
    color: var(--err);
    font-style: normal;
  }

  .opt {
    font-weight: 500;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }

  input[type=text],
  input[type=tel],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
    background: #fffdfd;
    color: var(--ink);
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--maroon);
    box-shadow: 0 0 0 3px rgba(98, 17, 25, .1);
  }

  textarea {
    resize: vertical;
  }

  .hint {
    display: block;
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .hp {
    position: absolute;
    left: -9999px;
    opacity: 0;
    height: 0;
    width: 0;
  }

  /* ---------- attachment blocks ---------- */
  .block {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
    background: #fffdfd;
  }

  .block.required {
    border-color: var(--maroon);
    border-style: solid;
    background: var(--maroon-soft);
  }

  .block-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .block-head .label {
    margin-bottom: 0;
  }

  .count {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 9px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .thumb {
    position: relative;
    padding-top: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #f0e7e7;
  }

  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb.pending::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, .55) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 50 50'><circle cx='25' cy='25' r='20' fill='none' stroke='%23621119' stroke-width='5' stroke-linecap='round' stroke-dasharray='80 40'><animateTransform attributeName='transform' type='rotate' from='0 25 25' to='360 25 25' dur='.9s' repeatCount='indefinite'/></circle></svg>") center / 28px no-repeat;
  }

  .kill {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0;
    background: rgba(43, 26, 28, .78);
    color: #fff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
  }

  .file-list {
    margin-top: 10px;
    display: grid;
    gap: 8px;
  }

  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    font-size: 13px;
  }

  .file-row .fname {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-row .fsize {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .file-row .kill {
    position: static;
    background: var(--maroon-soft);
    color: var(--maroon);
  }

  .file-row audio {
    width: 100%;
    max-width: 100%;
  }

  .file-row.audio {
    display: block;
  }

  .file-row.audio .audio-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit;
    font-weight: 700;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn:disabled {
    opacity: .6;
    cursor: default;
  }

  .btn.primary {
    width: 100%;
    background: var(--maroon);
    color: #fff;
    font-size: 16px;
    margin-top: 4px;
  }

  .btn.primary:hover:not(:disabled) {
    background: var(--maroon-dark);
  }

  .btn.ghost {
    background: #fff;
    border-color: var(--maroon);
    color: var(--maroon);
    font-size: 14px;
  }

  .btn.ghost:hover:not(:disabled) {
    background: var(--maroon-soft);
  }

  .btn.rec {
    background: #fff;
    border-color: var(--maroon);
    color: var(--maroon);
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn.rec .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--maroon);
  }

  .btn.rec.on {
    background: var(--maroon);
    color: #fff;
    border-color: var(--maroon);
  }

  .btn.rec.on .dot {
    background: #fff;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }

  .voice-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--maroon);
  }

  .error {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fdecea;
    border: 1px solid #f3c2bd;
    color: var(--err);
    font-size: 14px;
  }

  .legal {
    margin: 12px 0 0;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  /* ---------- done ---------- */
  .done {
    text-align: center;
  }

  .tick {
    width: 60px;
    height: 60px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: #e8f6ee;
    color: var(--ok);
    font-size: 30px;
    display: grid;
    place-items: center;
  }

  .ticket-box {
    background: #e8edf7;
    border-radius: 12px;
    padding: 14px;
    margin: 16px 0;
  }

  .ticket-box span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .ticket-box strong {
    font-size: 22px;
    color: var(--navy);
  }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(43, 26, 28, .55);
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 50;
  }

  .overlay-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 12px;
    border: 3px solid var(--line);
    border-top-color: var(--maroon);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .overlay-text {
    margin: 0 0 12px;
    font-weight: 700;
    font-size: 15px;
  }

  .overlay-sub {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--maroon);
    transition: width .2s;
  }

  @media (max-width: 420px) {
    body { padding: 12px; }
    .card { padding: 16px; }
  }
</style>
